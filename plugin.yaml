name: hermes-session-diff
version: 0.1.0
description: Persistent session file changes and quick diffs in Hermes Desktop.
author: Adolanium
license: MIT
manifest_version: 1
requires_hermes: ">=0.21.3"
kind: standalone
provides_tools: []
provides_hooks: [pre_llm_call]
provides_middleware: [tool_execution]
requires_env: []
python_dependencies: ["boto3>=1.26"]
config_schema:
  dynamodb_table:
    type: string
    default: ""
    description: DynamoDB table holding the change journal. SESSION_DIFF_TABLE overrides it.
  s3_bucket:
    type: string
    default: ""
    description: S3 bucket holding snapshot contents. SESSION_DIFF_BUCKET overrides it.
  s3_prefix:
    type: string
    default: session-diff
    description: Key prefix for snapshot objects. SESSION_DIFF_PREFIX overrides it.
  aws_region:
    type: string
    default: ""
    description: AWS region for both services. SESSION_DIFF_REGION overrides it; empty uses the default AWS chain.
  retention_days:
    type: integer
    default: 30
    description: Days to retain recorded changes.
  terminal_capture:
    type: boolean
    default: true
    description: Compare bounded workspace snapshots around terminal commands.
